name: MCP

on:
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  push:
    branches: [main]
    paths: ['mcp/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
